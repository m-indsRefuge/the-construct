[project]
name = "the-construct"
version = "0.1.0"
description = "A self-modifying symbolic computational world."
requires-python = ">=3.12"
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
construct-observatory = "construct.observatory.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
